    "osmnx>=2.0.1",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "plotly>=6.0.1",
    "pyhdf>=0.11.6",
    "pystac-client>=0.8.6",
    "rasterstats>=0.20.0",
    "requests>=2.32.3",
    "rioxarray>=0.18.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "shapely>=2.0.7",
